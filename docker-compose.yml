services:
  db:
    image: postgres:16-alpine
    container_name: tsa_db
    env_file: .env
    restart: unless-stopped
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: truck-signs-api-backend:1.0.0
    networks:
      - tsa-network
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
    - "${BACKEND_PORT}:8000"
    volumes:
      - static_data:/app/src/staticfiles
      - media_data:/app/src/media

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  tsa-network:
    driver: bridge
