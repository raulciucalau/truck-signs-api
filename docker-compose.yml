services:
  db:
    image: postgres:16-alpine
    container_name: tsa_db
    env_file: .env
    restart: unless-stopped
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: dein-dockerhub-user/truck-signs-api:v1
    container_name: tsa_backend
    networks:
      - tsa-network
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8020:8000'

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  tsa-network:
    driver: bridge
